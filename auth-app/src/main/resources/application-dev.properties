spring.application.name=auth-app

# MYSQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# spring.datasource.hikari.pool-name=HikariCP
# spring.datasource.hikari.maximum-pool-size=5
# spring.datasource.hikari.connection-timeout=30000
# spring.datasource.hikari.idle-timeout=600000
# spring.datasource.hikari.max-lifetime=1800000
# spring.datasource.hikari.leak-detection-threshold=0
# spring.datasource.hikari.initialization-fail-timeout=-1

# Set the admin username
spring.security.user.name=admin

# Set the admin password
spring.security.user.password=very-strong-password

# Set the logging level for Spring Security to DEBUG
loging.level.org.springframework.security=DEBUG


# Oauth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:github-client-secret}
spring.security.oauth2.client.registration.github.scope=user:email

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


app.auth.frontend.success-redirect=${FRONTEND_SUCCESS_REDIRECT:http://localhost:5173/auth/success}
app.auth.frontend.failure-redirect=${FRONTEND_FAILURE_REDIRECT:http://localhost:3000/auth/failure}

# Assign the ADMIN role
spring.security.user.roles=ADMIN

spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Security Configuration
security.jwt.secret=${JWT_SECRET:2c+Jk3v8zAU1Pj7l2DSK/4ZuQh8N2HcD6hDIkD7isXvwNsPXfD51s/hY0QAxRmuy7nBsE6GpZC4VvR4rkwd2rw==}
security.jwt.issuer=${JWT_ISSUER:auth.backend.com}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}
security.jwt.refresh-token-cookie-name=${JWT_REFRESH_TOKEN_COOKIE_NAME:refreshToken}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:localhost}


spring.port=8080
