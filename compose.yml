services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: auth-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: auth_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-pyourpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
